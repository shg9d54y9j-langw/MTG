<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schichtblick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: Kalender als Hauptfläche links, ruhige Seitenleiste rechts (Nächster Dienst, Stunden, Tauschbörse); Tagesdetails als Schublade. */
:root{
  --bg:#f5f8f7; --surface:#ffffff; --surface-2:#eef3f1; --line:#dfe7e4;
  --fg:#1d2b28; --muted:#5f716c; --accent:#1f8a70; --accent-soft:#d9f0e8; --accent-fg:#ffffff;
  --early:#f6b93b; --early-soft:#fff3d6; --early-fg:#7a5200;
  --late:#f07a5a; --late-soft:#fde5dd; --late-fg:#8a2f16;
  --night:#5b63d3; --night-soft:#e5e6fb; --night-fg:#2d3392;
  --off-soft:#eef3f1; --off-fg:#5f716c;
  --vac:#2aa3b8; --vac-soft:#dbf2f6; --vac-fg:#145a66;
  --warn:#c2410c; --warn-soft:#ffedd5; --ok:#15803d;
  --shadow:0 1px 2px rgba(24,48,42,.06),0 6px 24px rgba(24,48,42,.07);
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a18; --surface:#1a2421; --surface-2:#22302c; --line:#2c3b37;
  --fg:#e6eeeb; --muted:#9db0aa; --accent:#3fbf98; --accent-soft:#1d3c33; --accent-fg:#0b1a15;
  --early:#f6b93b; --early-soft:#3a2f14; --early-fg:#ffd98a;
  --late:#f58a6c; --late-soft:#3d231b; --late-fg:#ffb9a5;
  --night:#8b92f0; --night-soft:#262a52; --night-fg:#c3c7ff;
  --off-soft:#22302c; --off-fg:#9db0aa;
  --vac:#4cc3d6; --vac-soft:#173a40; --vac-fg:#a5e7f1;
  --warn:#fb923c; --warn-soft:#3b2414; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a18; --surface:#1a2421; --surface-2:#22302c; --line:#2c3b37;
  --fg:#e6eeeb; --muted:#9db0aa; --accent:#3fbf98; --accent-soft:#1d3c33; --accent-fg:#0b1a15;
  --early:#f6b93b; --early-soft:#3a2f14; --early-fg:#ffd98a;
  --late:#f58a6c; --late-soft:#3d231b; --late-fg:#ffb9a5;
  --night:#8b92f0; --night-soft:#262a52; --night-fg:#c3c7ff;
  --off-soft:#22302c; --off-fg:#9db0aa;
  --vac:#4cc3d6; --vac-soft:#173a40; --vac-fg:#a5e7f1;
  --warn:#fb923c; --warn-soft:#3b2414; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* Kopf */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg)}
.brand h1{font-size:1.45rem}
.brand small{display:block;color:var(--muted);font-size:.82rem;font-family:var(--body);font-weight:500}
.monthnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.monthnav button{border:0;background:transparent;width:36px;height:36px;border-radius:999px;display:grid;place-items:center}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .label{min-width:150px;text-align:center;font-weight:700;font-family:var(--display);font-size:1.05rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Raster */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cal{padding:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:4px 4px 12px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow div{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0 6px 6px}
.day{position:relative;min-height:104px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.day:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.day.out{opacity:.42}
.day.weekend{background:var(--surface-2)}
.day.today{border:2px solid var(--accent);padding:7px}
.day .num{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.day.today .num b{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 7px}
.day .hol{font-size:.68rem;color:var(--muted);font-weight:600;line-height:1.2}
.chip{border-radius:8px;padding:5px 7px;font-size:.78rem;font-weight:700;line-height:1.2;display:flex;flex-direction:column}
.chip small{font-weight:500;font-size:.72rem;opacity:.85;font-variant-numeric:tabular-nums}
.chip.F{background:var(--early-soft);color:var(--early-fg);box-shadow:inset 3px 0 0 var(--early)}
.chip.S{background:var(--late-soft);color:var(--late-fg);box-shadow:inset 3px 0 0 var(--late)}
.chip.N{background:var(--night-soft);color:var(--night-fg);box-shadow:inset 3px 0 0 var(--night)}
.chip.U{background:var(--vac-soft);color:var(--vac-fg);box-shadow:inset 3px 0 0 var(--vac)}
.chip.X{background:transparent;color:var(--off-fg);padding-left:0;font-weight:600}
.badges{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.badge{font-size:.68rem;font-weight:700;border-radius:999px;padding:2px 7px;display:inline-flex;align-items:center;gap:3px}
.badge.wish{background:var(--accent-soft);color:var(--accent)}
.badge.swap{background:var(--warn-soft);color:var(--warn)}
.badge.got{background:var(--night-soft);color:var(--night-fg)}
.short{display:none}
@media (max-width:640px){
  .cal{padding:10px}
  .dow,.days{gap:4px}
  .day{min-height:70px;padding:5px;border-radius:10px}
  .day.today{padding:4px}
  .chip{padding:3px 4px;font-size:.8rem;align-items:center;box-shadow:none!important}
  .chip small,.chip .long,.day .hol{display:none}
  .short{display:inline}
  .badge{padding:1px 4px}
  .badge .bt{display:none}
  .monthnav .label{min-width:120px}
}

/* Seitenleiste */
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:1.05rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.next{display:flex;gap:14px;align-items:center}
.next .big{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;font-weight:700;flex:none}
.next .big.F{background:var(--early-soft);color:var(--early-fg)}
.next .big.S{background:var(--late-soft);color:var(--late-fg)}
.next .big.N{background:var(--night-soft);color:var(--night-fg)}
.next .big.U{background:var(--vac-soft);color:var(--vac-fg)}
.next .meta{min-width:0}
.next .meta b{display:block;font-size:1.05rem}
.next .meta span{color:var(--muted);font-size:.88rem}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.88rem}
.row .muted{color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:6px 8px;font-weight:600;font-size:.85rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.item .head{display:flex;align-items:center;gap:8px}
.avatar{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-size:.75rem;font-weight:700;flex:none;background:var(--accent-soft);color:var(--accent)}
.item .who{font-weight:600;font-size:.9rem;margin-right:auto}
.pill{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px}
.pill.F{background:var(--early-soft);color:var(--early-fg)}
.pill.S{background:var(--late-soft);color:var(--late-fg)}
.pill.N{background:var(--night-soft);color:var(--night-fg)}
.pill.state{background:var(--surface-2);color:var(--muted)}
.pill.okp{background:var(--accent-soft);color:var(--accent)}
.item p{margin:0;font-size:.85rem;color:var(--muted)}
.item .actions{display:flex;gap:6px;flex-wrap:wrap}
.item .actions .btn{padding:5px 11px;font-size:.82rem}
.empty{color:var(--muted);font-size:.88rem;text-align:center;padding:12px}
.deadline{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 10px;font-size:.85rem;font-weight:600}

/* Schublade */
.scrim{position:fixed;inset:0;background:rgba(15,30,26,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:21;transform:translateX(102%);visibility:hidden;transition:transform .25s ease,visibility .25s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none;visibility:visible}
@media (max-width:640px){
  .drawer{top:auto;left:0;width:100%;max-height:88%;border-radius:20px 20px 0 0;transform:translateY(102%);padding-left:env(safe-area-inset-left,0px)}
}
.dhead{padding:18px 20px 12px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:1.3rem}
.dhead p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.dhead .x{margin-left:auto;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:999px;display:grid;place-items:center;flex:none}
.dbody{padding:16px 20px 24px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.shiftbox{border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.shiftbox.F{background:var(--early-soft);color:var(--early-fg)}
.shiftbox.S{background:var(--late-soft);color:var(--late-fg)}
.shiftbox.N{background:var(--night-soft);color:var(--night-fg)}
.shiftbox.U{background:var(--vac-soft);color:var(--vac-fg)}
.shiftbox.X{background:var(--surface-2);color:var(--off-fg)}
.shiftbox b{font-family:var(--display);font-size:1.2rem;display:block}
.section{display:flex;flex-direction:column;gap:10px}
.section h3{font-size:.95rem}
.team{display:flex;flex-wrap:wrap;gap:6px}
.team span{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 3px;font-size:.85rem}
.team .avatar{width:24px;height:24px;font-size:.68rem}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices label{position:relative}
.choices input{position:absolute;opacity:0;inset:0}
.choices span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.choices input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.choices input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--fg);resize:vertical}
.note{font-size:.85rem;border-radius:12px;padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.split{display:flex;gap:8px;flex-wrap:wrap}

/* Toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:30;width:min(420px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:.9rem;font-weight:500;box-shadow:var(--shadow);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
footer{color:var(--muted);font-size:.8rem;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
svg{flex:none}
</style>
</head>
<body>
<style>
.status{display:inline-flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:999px;background:var(--muted);display:inline-block}
.status.live i{background:var(--ok)}
.status.demo i{background:var(--early)}
.banner{border-radius:var(--r);padding:12px 16px;font-size:.9rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner b{font-weight:700}
.loading{padding:48px 16px;text-align:center;color:var(--muted)}
.lead{border-color:var(--accent)}
.lead .eyebrow{color:var(--accent)}
.member{display:flex;align-items:center;gap:8px;font-size:.88rem}
.member .nm{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{font:inherit;font-size:.82rem;border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--surface);color:var(--fg)}
.wishday{display:flex;gap:8px;align-items:baseline;font-size:.86rem}
.wishday b{min-width:84px;font-variant-numeric:tabular-nums}
.wishday span{color:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 15l2.5 2.5L16 13"/></svg></div>
      <div><h1>Schichtblick</h1><small class="status" id="status"><i></i><span>Verbinde …</span></small></div>
    </div>
    <div class="monthnav" role="group" aria-label="Monat wählen">
      <button id="prev" aria-label="Vorheriger Monat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="label" id="monthLabel" aria-live="polite"></div>
      <button id="next" aria-label="Nächster Monat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button class="btn" id="todayBtn">Heute</button>
  </header>

  <div id="banner"></div>

  <div class="grid">
    <main class="panel cal">
      <div class="legend" aria-label="Legende">
        <span><i class="dot" style="background:var(--early)"></i>Früh 06–14</span>
        <span><i class="dot" style="background:var(--late)"></i>Spät 14–22</span>
        <span><i class="dot" style="background:var(--night)"></i>Nacht 22–06</span>
        <span><i class="dot" style="background:var(--vac)"></i>Urlaub</span>
        <span><span class="badge wish">★</span>Wunsch</span>
        <span><span class="badge swap">⇄</span>Tausch</span>
      </div>
      <div class="dow" aria-hidden="true"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div>
      <div class="days" id="days"><div class="loading" style="grid-column:1/-1">Dienstplan wird geladen …</div></div>
    </main>

    <aside class="side">
      <section class="panel card lead" id="leadCard" hidden aria-labelledby="leadH">
        <div class="eyebrow">Teamleitung</div>
        <div class="row"><h2 id="leadH">Tausche freigeben</h2><span class="muted" id="leadCount"></span></div>
        <div class="list" id="leadList"></div>
      </section>

      <section class="panel card" aria-labelledby="nextH">
        <div class="eyebrow" id="nextH">Dein nächster Dienst</div>
        <div id="nextShift"></div>
      </section>

      <section class="panel card" aria-labelledby="swapH">
        <div class="row"><h2 id="swapH">Tauschbörse</h2><span class="muted" id="swapCount"></span></div>
        <div class="tabs" role="tablist">
          <button role="tab" id="tabTeam" aria-selected="true">Vom Team</button>
          <button role="tab" id="tabMine" aria-selected="false">Meine</button>
        </div>
        <div class="list" id="swapList"></div>
      </section>

      <section class="panel card" aria-labelledby="hoursH">
        <div class="row"><h2 id="hoursH">Stunden im <span id="hoursMonth"></span></h2><span class="muted" id="hoursTxt"></span></div>
        <div class="bar"><i id="hoursBar"></i></div>
        <div class="stats" id="stats"></div>
      </section>

      <section class="panel card" aria-labelledby="wishH">
        <div class="row"><h2 id="wishH">Meine Wünsche</h2><span class="muted" id="wishCount"></span></div>
        <div class="deadline" id="deadline"></div>
        <div class="list" id="wishList"></div>
      </section>

      <section class="panel card lead" id="leadWishCard" hidden aria-labelledby="lwH">
        <div class="eyebrow">Teamleitung</div>
        <div class="row"><h2 id="lwH">Wünsche im Team</h2><span class="muted" id="lwCount"></span></div>
        <div class="list" id="leadWishes"></div>
      </section>

      <section class="panel card" aria-labelledby="teamH">
        <div class="row"><h2 id="teamH">Team</h2><span class="muted" id="teamCount"></span></div>
        <div class="list" id="teamList"></div>
      </section>
    </aside>
  </div>

  <footer>
    <span id="footNote"></span>
    <button class="btn ghost" id="reset" hidden>Demo zurücksetzen</button>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dhead">
    <div><h2 id="dTitle"></h2><p id="dSub"></p></div>
    <button class="x" id="dClose" aria-label="Schließen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";
const SHIFTS={
  F:{name:"Frühdienst",short:"F",time:"06:00–14:00",start:6,end:14,h:8},
  S:{name:"Spätdienst",short:"S",time:"14:00–22:00",start:14,end:22,h:8},
  N:{name:"Nachtdienst",short:"N",time:"22:00–06:00",start:22,end:30,h:8},
  U:{name:"Urlaub",short:"U",time:"ganztägig",h:7.7},
  X:{name:"Frei",short:"–",time:""}
};
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const WD=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const GROUPS=["Gruppe A","Gruppe B","Gruppe C","Gruppe D"];
const WISH_LIMIT=4, WEEK_HOURS=38.5, MIN_REST=11;
const PATTERN="FFFSSSNNN---"; // 3 Früh, 3 Spät, 3 Nacht, 3 frei; 4 Gruppen versetzt um 3 Tage
const EPOCH=new Date(2026,0,5);

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=new Date();today.setHours(0,0,0,0);
const TODAY=iso(today);
const fmt=s=>{const d=fromIso(s);return WD[d.getDay()].slice(0,2)+", "+d.getDate()+". "+MONTHS[d.getMonth()].slice(0,3)+"."};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hash(str){let h=2166136261;for(const c of String(str)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const newId=()=>"o"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// Feiertage (bundesweit)
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
const holCache={};
function holidays(y){if(holCache[y])return holCache[y];const e=easter(y),m={};
  [[`${y}-01-01`,"Neujahr"],[`${y}-05-01`,"Tag der Arbeit"],[`${y}-10-03`,"Tag der Dt. Einheit"],[`${y}-12-25`,"1. Weihnachtstag"],[`${y}-12-26`,"2. Weihnachtstag"]].forEach(([k,v])=>m[k]=v);
  [[-2,"Karfreitag"],[1,"Ostermontag"],[39,"Christi Himmelfahrt"],[50,"Pfingstmontag"]].forEach(([o,v])=>m[iso(addDays(e,o))]=v);
  return holCache[y]=m}
const holiday=s=>holidays(+s.slice(0,4))[s];

/* ---------- Datenschicht: Team-Modus (db) oder Demo (Browser) ---------- */
const data={members:{},wishes:{},offers:{},approvals:{}};
let mode="pending", me=null, isLead=false, canWrite=true, db=null, userApi=null;
const names={};
let over={}, given={}, got={};

const DEMO_KEY="schichtblick-demo-v2";
const DEMO_TEAM=["Mira Hoffmann","Jonas Weber","Lea Schulz","Deniz Kaya","Paul Richter","Sofia Lang","Tom Becker","Aylin Demir","Ben Krüger"];
function demoSeed(){
  data.members={me:{group:0,vacation:[]}};data.wishes={};data.offers={};data.approvals={};
  DEMO_TEAM.forEach((n,i)=>{data.members["d"+i]={group:(i+1)%4,vacation:[]}});
  for(let i=0;i<5;i++)data.members.me.vacation.push(iso(addDays(today,16+i)));
  rebuild();
  const notes=["Elternabend in der Schule, ab 17 Uhr.","Hochzeit meiner Schwester.","Arzttermin morgens.",""];
  const wants=["Frühdienst oder frei","egal","Spätdienst","Wochenende frei"];
  let k=0;
  for(let i=2;i<40&&k<4;i++){const s=iso(addDays(today,i));if(shiftFor("me",s)!=="X")continue;
    const who=Object.keys(data.members).find(u=>u!=="me"&&"FSN".includes(shiftFor(u,s))&&(k===3||!restConflict("me",s,shiftFor(u,s)))&&!Object.values(data.offers).some(o=>o.by===u||o.date===s));
    if(!who)continue;
    const id="seed"+k;data.offers[id]={by:who,date:s,shift:shiftFor(who,s),want:wants[k],note:notes[k],status:"open",takenBy:null,created:Date.now()};k++}
}
function demoSave(){try{localStorage.setItem(DEMO_KEY,JSON.stringify(data))}catch(e){}}
function demoLoad(){try{const r=JSON.parse(localStorage.getItem(DEMO_KEY)||"null");if(r&&r.members&&r.members.me){Object.assign(data,r);return}}catch(e){}demoSeed();demoSave()}

async function put(col,id,obj){
  if(mode==="demo"){data[col][id]=obj;demoSave();changed();return true}
  try{await db.collection(col).doc(id).set(obj);return true}
  catch(e){writeFailed(e);return false}
}
async function del(col,id){
  if(mode==="demo"){delete data[col][id];demoSave();changed();return true}
  try{await db.collection(col).doc(id).delete();return true}
  catch(e){writeFailed(e);return false}
}
function writeFailed(e){
  if(e&&e.code==="invalid_argument"){canWrite=false;renderBanner();render();refreshDrawer();toast("Du hast hier nur Leserechte. Bitte die Teamleitung, dich als Mitwirkende:n einzuladen.")}
  else if(e&&e.code==="quota_exceeded")toast("Der Speicher des Dienstplans ist voll. Die Teamleitung sollte alte Tauschangebote löschen.");
  else toast("Speichern hat nicht geklappt. Prüfe deine Verbindung und versuche es noch einmal.");
}

/* ---------- Dienste berechnen ---------- */
function baseShift(uid,s){
  const g=(data.members[uid]&&data.members[uid].group)||0;
  const idx=Math.round((fromIso(s)-EPOCH)/864e5)+g*3,L=PATTERN.length;
  const c=PATTERN[((idx%L)+L)%L];return c==="-"?"X":c;
}
function rebuild(){
  over={};given={};got={};
  for(const [id,o] of Object.entries(data.offers)){
    if(!o||!data.approvals[id]||!o.takenBy)continue;
    over[o.takenBy+"|"+o.date]=o.shift;over[o.by+"|"+o.date]="X";
    given[o.by+"|"+o.date]=o.takenBy;got[o.takenBy+"|"+o.date]=o.by;
  }
}
function shiftFor(uid,s){
  const k=uid+"|"+s;if(over[k])return over[k];
  const m=data.members[uid];if(m&&Array.isArray(m.vacation)&&m.vacation.includes(s))return"U";
  return baseShift(uid,s);
}
const myShift=s=>shiftFor(me,s);
function colleagues(s,sh){
  if(!"FSN".includes(sh))return[];
  return Object.keys(data.members).filter(u=>u!==me&&shiftFor(u,s)===sh);
}
function restConflict(uid,s,sh){
  const S=SHIFTS[sh];if(!S||S.start==null)return null;
  const prev=SHIFTS[shiftFor(uid,iso(addDays(fromIso(s),-1)))],next=SHIFTS[shiftFor(uid,iso(addDays(fromIso(s),1)))];
  if(prev&&prev.end!=null){const gap=24+S.start-prev.end;if(gap<MIN_REST)return`Nur ${gap} h Ruhezeit nach deinem ${prev.name} am Vortag (mindestens ${MIN_REST} h).`}
  if(next&&next.start!=null){const gap=24+next.start-S.end;if(gap<MIN_REST)return`Nur ${gap} h Ruhezeit bis zu deinem ${next.name} am Folgetag (mindestens ${MIN_REST} h).`}
  return null;
}
const myWishes=()=>(data.wishes[me]&&data.wishes[me].items)||{};
const nameOf=u=>u===me?"Du":(names[u]||"Kolleg:in");
const firstOf=u=>nameOf(u).split(" ")[0];
const initials=u=>{const n=nameOf(u);return n==="Kolleg:in"?"?":n.split(" ").map(p=>p[0]).join("").slice(0,2)};
const offerList=()=>Object.entries(data.offers).filter(([,o])=>o&&o.date).map(([id,o])=>Object.assign({id},o));
const approved=o=>!!data.approvals[o.id];

/* ---------- Ansicht ---------- */
let view=new Date(today.getFullYear(),today.getMonth(),1);
let tab="team";
const $=id=>document.getElementById(id);

let namesPending=false;
async function refreshNames(){
  if(mode!=="live"||!userApi||namesPending)return;
  const ids=new Set(Object.keys(data.members));offerList().forEach(o=>{ids.add(o.by);if(o.takenBy)ids.add(o.takenBy)});Object.keys(data.wishes).forEach(i=>ids.add(i));
  ids.delete(me);if(!ids.size)return;
  namesPending=true;
  try{const ps=await userApi.profiles([...ids]);let ch=false;for(const id of ids){const n=(ps[id]&&ps[id].name)||"";if(n&&names[id]!==n){names[id]=n;ch=true}}if(ch)render()}catch(e){}
  namesPending=false;
}
function changed(){rebuild();render();refreshDrawer();refreshNames()}

function render(){
  if(mode==="pending")return;
  renderCal();renderNext();renderHours();renderSwaps();renderWishes();renderTeam();renderLead();
}

function renderBanner(){
  const st=$("status");st.className="status "+(mode==="live"?"live":mode==="demo"?"demo":"");
  st.querySelector("span").textContent=mode==="live"?(isLead?"Live im Team · Teamleitung":"Live im Team"):mode==="demo"?"Demo · nur in diesem Browser":"Verbinde …";
  let b="";
  if(mode==="demo")b=`<div class="banner warn"><span><b>Demo-Modus.</b> Kolleg:innen und ihre Antworten sind Beispiele. Öffne Schichtblick angemeldet über claude.ai, um mit deinem echten Team zu planen.</span></div>`;
  else if(mode==="live"&&!canWrite)b=`<div class="banner warn"><span><b>Nur lesen.</b> Du kannst den Plan ansehen, aber keine Wünsche oder Tausche eintragen. Bitte die Teamleitung, dich als Mitwirkende:n einzuladen.</span></div>`;
  else if(mode==="live"&&Object.keys(data.members).length<=1&&loaded)b=`<div class="banner info"><span><b>Noch bist du allein im Team.</b> Teile diesen Dienstplan über „Teilen“ mit deinen Kolleg:innen und gib ihnen die Rolle Mitwirkende:r. Sobald sie ihn öffnen, erscheinen sie hier und können Dienste tauschen.</span></div>`;
  $("banner").innerHTML=b;
  $("footNote").textContent=mode==="demo"?"Demo-Daten bleiben nur in diesem Browser gespeichert.":"Wünsche sieht nur die Teamleitung. Tauschangebote sieht das ganze Team.";
  $("reset").hidden=mode!=="demo";
}

function renderCal(){
  const y=view.getFullYear(),m=view.getMonth();
  $("monthLabel").textContent=MONTHS[m]+" "+y;
  const start=addDays(view,-((view.getDay()+6)%7));
  const offers=offerList(),wishes=myWishes();
  let html="";
  for(let i=0;i<42;i++){
    const d=addDays(start,i);
    if(i===35&&d.getMonth()!==m)break;
    const s=iso(d),sh=myShift(s),S=SHIFTS[sh],hol=holiday(s);
    const cls=["day"];if(d.getMonth()!==m)cls.push("out");if(d.getDay()===0||d.getDay()===6||hol)cls.push("weekend");if(s===TODAY)cls.push("today");
    let badges="";const w=wishes[s];
    if(w)badges+=`<span class="badge wish" title="Wunsch: ${esc(w.type)}">★<span class="bt"> Wunsch</span></span>`;
    const mine=offers.find(o=>o.by===me&&o.date===s&&!approved(o));
    if(mine)badges+=`<span class="badge swap">⇄<span class="bt"> ${mine.status==="agreed"?"Freigabe":mine.status==="requested"?"Antwort":"Tausch"}</span></span>`;
    const req=offers.find(o=>o.takenBy===me&&o.date===s&&!approved(o));
    if(req)badges+=`<span class="badge got">+<span class="bt"> ${req.status==="agreed"?"Freigabe":"angefragt"}</span></span>`;
    if(given[me+"|"+s])badges+=`<span class="badge got">⇄<span class="bt"> abgegeben</span></span>`;
    if(got[me+"|"+s])badges+=`<span class="badge got">+<span class="bt"> übernommen</span></span>`;
    const chip=sh==="X"?`<div class="chip X"><span class="long">frei</span><span class="short">·</span></div>`
      :`<div class="chip ${sh}"><span class="long">${S.name.replace("dienst","")}</span><span class="short">${S.short}</span>${S.start!=null?`<small>${S.time}</small>`:""}</div>`;
    const label=`${WD[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}: ${S.name}${hol?", "+hol:""}`;
    html+=`<button class="${cls.join(" ")}" data-d="${s}" aria-label="${esc(label)}"><div class="num"><b>${d.getDate()}</b></div>${hol?`<div class="hol">${esc(hol)}</div>`:""}${chip}<div class="badges">${badges}</div></button>`;
  }
  $("days").innerHTML=html;
}

function renderNext(){
  let found=null;
  for(let i=0;i<60;i++){const s=iso(addDays(today,i)),sh=myShift(s);if("FSN".includes(sh)){found={s,sh};break}}
  if(!found){$("nextShift").innerHTML=`<p class="empty">In den nächsten Wochen ist kein Dienst geplant.</p>`;return}
  const S=SHIFTS[found.sh],diff=Math.round((fromIso(found.s)-today)/864e5);
  const when=diff===0?"Heute":diff===1?"Morgen":"In "+diff+" Tagen";
  const team=colleagues(found.s,found.sh).map(firstOf);
  $("nextShift").innerHTML=`<div class="next"><div class="big ${found.sh}">${S.short}</div><div class="meta"><b>${when} · ${S.name}</b><span>${fmt(found.s)} · ${S.time}<br>${team.length?"mit "+esc(team.join(", ")):"noch niemand aus dem Team eingeteilt"}</span></div></div>
  <button class="btn" data-open="${found.s}">Details ansehen</button>`;
}

function renderHours(){
  const y=view.getFullYear(),m=view.getMonth(),days=new Date(y,m+1,0).getDate();
  let soll=0,ist=0,n=0,wk=0;
  for(let i=1;i<=days;i++){const d=new Date(y,m,i),s=iso(d),wd=d.getDay();
    if(wd>0&&wd<6&&!holiday(s))soll+=WEEK_HOURS/5;
    const sh=myShift(s);if(SHIFTS[sh].h)ist+=SHIFTS[sh].h;if(sh==="N")n++;
    if((wd===0||wd===6)&&"FSN".includes(sh))wk++}
  soll=Math.round(soll*10)/10;ist=Math.round(ist*10)/10;
  const diff=Math.round((ist-soll)*10)/10;
  $("hoursMonth").textContent=MONTHS[m];
  $("hoursTxt").textContent=`${ist.toLocaleString("de-DE")} / ${soll.toLocaleString("de-DE")} h`;
  $("hoursBar").style.width=Math.min(100,ist/soll*100)+"%";
  $("stats").innerHTML=`
    <div class="stat"><b style="color:${diff>=0?"var(--ok)":"var(--warn)"}">${diff>0?"+":""}${diff.toLocaleString("de-DE")}</b><span>Stunden-Saldo</span></div>
    <div class="stat"><b>${n}</b><span>Nächte</span></div>
    <div class="stat"><b>${wk}</b><span>Wochenend­dienste</span></div>`;
}

function offerStatusPill(o){
  if(approved(o))return`<span class="pill okp">freigegeben</span>`;
  if(o.status==="agreed")return`<span class="pill state">wartet auf Teamleitung</span>`;
  if(o.status==="requested")return`<span class="pill state">${o.by===me?esc(firstOf(o.takenBy))+" möchte":"angefragt"}</span>`;
  return`<span class="pill state">offen</span>`;
}
function renderSwaps(){
  $("tabTeam").setAttribute("aria-selected",tab==="team");$("tabMine").setAttribute("aria-selected",tab==="mine");
  const all=offerList().filter(o=>o.date>=TODAY);
  const team=all.filter(o=>o.by!==me&&!approved(o)&&(o.status==="open"||o.takenBy===me)).sort((a,b)=>a.date.localeCompare(b.date));
  const mine=all.filter(o=>o.by===me||o.takenBy===me).sort((a,b)=>a.date.localeCompare(b.date));
  $("swapCount").textContent=`${team.filter(o=>o.status==="open").length} offen`;
  let html="";
  if(tab==="team"){
    if(!team.length)html=`<p class="empty">Gerade sucht niemand Ersatz.</p>`;
    team.forEach(o=>{
      const mineSh=myShift(o.date),busy=mineSh!=="X",rc=!busy&&restConflict(me,o.date,o.shift);
      html+=`<div class="item"><div class="head"><span class="avatar">${esc(initials(o.by))}</span><span class="who">${esc(firstOf(o.by))}</span><span class="pill ${o.shift}">${SHIFTS[o.shift].short} · ${fmt(o.date)}</span></div>
      ${o.note?`<p>„${esc(o.note)}“</p>`:""}<p>Sucht im Gegenzug: ${esc(o.want)}</p>
      ${o.takenBy===me?offerStatusPill(o)
       :!canWrite?""
       :busy?`<p style="color:var(--warn)">Du hast an dem Tag selbst ${SHIFTS[mineSh].name}.</p>`
       :rc?`<p style="color:var(--warn)">${esc(rc)}</p>`
       :`<div class="actions"><button class="btn primary" data-take="${o.id}">Ich übernehme</button><button class="btn" data-open="${o.date}">Tag ansehen</button></div>`}
      </div>`});
  }else{
    if(!mine.length)html=`<p class="empty">Du hast keinen Dienst zum Tausch angeboten. Tippe im Kalender auf einen Dienst, um ihn anzubieten.</p>`;
    mine.forEach(o=>{
      const own=o.by===me;
      html+=`<div class="item"><div class="head"><span class="pill ${o.shift}">${SHIFTS[o.shift].short} · ${fmt(o.date)}</span><span class="who"></span>${offerStatusPill(o)}</div>
      <p>${own?(o.takenBy?(approved(o)?"Übernimmt: ":"Möchte übernehmen: ")+esc(nameOf(o.takenBy)):"Dein Angebot, noch ohne Antwort."):"Du übernimmst diesen Dienst von "+esc(nameOf(o.by))+"."}</p>
      ${own&&o.status==="requested"&&canWrite?`<div class="actions"><button class="btn primary" data-agree="${o.id}">Annehmen</button><button class="btn" data-decline="${o.id}">Ablehnen</button></div>`:""}
      <div class="actions">${canWrite&&!approved(o)?(own?`<button class="btn danger" data-withdraw="${o.id}">Zurückziehen</button>`:`<button class="btn danger" data-cancel="${o.id}">Anfrage zurücknehmen</button>`):""}<button class="btn" data-open="${o.date}">Tag ansehen</button></div></div>`});
  }
  $("swapList").innerHTML=html;
}

function wishesIn(items,y,m){return Object.keys(items).filter(s=>{const d=fromIso(s);return d.getFullYear()===y&&d.getMonth()===m})}
function renderWishes(){
  const y=view.getFullYear(),m=view.getMonth(),items=myWishes(),list=wishesIn(items,y,m).sort();
  $("wishCount").textContent=`${list.length} von ${WISH_LIMIT}`;
  const dl=new Date(y,m-1,15);
  $("deadline").textContent=dl>=today?`Wunschfrist für ${MONTHS[m]}: ${dl.getDate()}. ${MONTHS[dl.getMonth()]}`:`Wünsche für ${MONTHS[m]} gehen als Nachtrag an die Teamleitung.`;
  $("wishList").innerHTML=list.length?list.map(s=>{const w=items[s];return`<div class="item"><div class="head"><span class="badge wish">★</span><span class="who">${fmt(s)}</span><span class="pill ${w.prio==="hoch"?"okp":"state"}">${w.prio==="hoch"?"wichtig":"wäre schön"}</span></div><p>${esc(w.type)}${w.note?" · "+esc(w.note):""}</p><div class="actions"><button class="btn" data-open="${s}">Bearbeiten</button></div></div>`}).join("")
    :`<p class="empty">Noch keine Wünsche für ${MONTHS[m]}. Tippe auf einen Tag, um einen Freiwunsch einzutragen.</p>`;
}

function renderTeam(){
  const ids=Object.keys(data.members).sort((a,b)=>a===me?-1:b===me?1:nameOf(a).localeCompare(nameOf(b)));
  $("teamCount").textContent=ids.length+(ids.length===1?" Person":" Personen");
  $("teamList").innerHTML=ids.length?ids.map(u=>{const g=(data.members[u]&&data.members[u].group)||0,sh=shiftFor(u,TODAY);
    return`<div class="member"><span class="avatar">${esc(initials(u))}</span><span class="nm">${esc(nameOf(u))}</span>
    <span class="pill ${"FSN".includes(sh)?sh:"state"}" title="Heute">${sh==="X"?"heute frei":sh==="U"?"Urlaub":"heute "+SHIFTS[sh].short}</span>
    ${isLead&&canWrite?`<select data-group="${esc(u)}" aria-label="Schichtgruppe von ${esc(nameOf(u))}">${GROUPS.map((n,i)=>`<option value="${i}" ${i===g?"selected":""}>${n}</option>`).join("")}</select>`:`<span class="pill state">${GROUPS[g]}</span>`}</div>`}).join("")
    :`<p class="empty">Noch niemand im Team.</p>`;
}

function renderLead(){
  $("leadCard").hidden=!isLead;$("leadWishCard").hidden=!isLead;
  if(!isLead)return;
  const pend=offerList().filter(o=>o.status==="agreed"&&!approved(o)&&o.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date));
  $("leadCount").textContent=pend.length?pend.length+" offen":"";
  $("leadList").innerHTML=pend.length?pend.map(o=>{const rc=restConflict(o.takenBy,o.date,o.shift);
    return`<div class="item"><div class="head"><span class="pill ${o.shift}">${SHIFTS[o.shift].short} · ${fmt(o.date)}</span></div>
    <p><b style="color:var(--fg)">${esc(nameOf(o.by))}</b> gibt ab an <b style="color:var(--fg)">${o.takenBy===me?"dich":esc(nameOf(o.takenBy))}</b></p>
    ${rc?`<p style="color:var(--warn)">Achtung: ${esc(rc.replace(/deinem|deinen|deine/g,"dem"))}</p>`:""}
    ${canWrite?`<div class="actions"><button class="btn primary" data-approve="${o.id}">Freigeben</button><button class="btn" data-reject="${o.id}">Ablehnen</button></div>`:""}</div>`}).join("")
    :`<p class="empty">Keine Tausche warten auf Freigabe.</p>`;
  // Wünsche im angezeigten Monat
  const y=view.getFullYear(),m=view.getMonth(),byDay={};
  for(const [u,doc] of Object.entries(data.wishes)){const it=(doc&&doc.items)||{};wishesIn(it,y,m).forEach(s=>{(byDay[s]=byDay[s]||[]).push({u,w:it[s]})})}
  const days=Object.keys(byDay).sort();
  $("lwCount").textContent=days.reduce((n,s)=>n+byDay[s].length,0)+" in "+MONTHS[m];
  $("leadWishes").innerHTML=days.length?days.map(s=>`<div class="wishday"><b>${fmt(s)}</b><span>${byDay[s].map(x=>esc(firstOf(x.u))+": "+esc(x.w.type)+(x.w.prio==="hoch"?" (wichtig)":"")).join(" · ")}</span></div>`).join("")
    :`<p class="empty">Für ${MONTHS[m]} hat noch niemand Wünsche eingetragen.</p>`;
}

/* ---------- Schublade ---------- */
let openDay=null,lastFocus=null;
function icon(sh){return sh==="F"?'<circle cx="12" cy="14" r="4"/><path d="M12 4v3M4 14H2M22 14h-2M5.6 7.6l1.4 1.4M18.4 7.6L17 9M3 20h18"/>':sh==="S"?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':sh==="N"?'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>':sh==="U"?'<path d="M2 20h20M6 20c0-6 3-10 6-12M12 8c2 1 5 0 6-2-3-1-5 0-6 2zM12 8c-1-2-4-3-6-2 1 2 4 3 6 2z"/>':'<path d="M4 12h16"/>'}
function openDrawer(s,keepFocus){
  if(mode==="pending")return;
  openDay=s;if(!keepFocus)lastFocus=document.activeElement;
  const d=fromIso(s),sh=myShift(s),S=SHIFTS[sh],hol=holiday(s);
  $("dTitle").textContent=`${WD[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}`;
  const diff=Math.round((d-today)/864e5);
  $("dSub").textContent=(hol?hol+" · ":"")+(diff===0?"Heute":diff>0?`in ${diff} Tag${diff>1?"en":""}`:`vor ${-diff} Tag${diff<-1?"en":""}`);
  const past=s<TODAY,w=myWishes()[s],work="FSN".includes(sh);
  const offers=offerList().filter(o=>o.date===s);
  const mine=offers.find(o=>o.by===me&&!approved(o));
  const g=given[me+"|"+s],gt=got[me+"|"+s];
  let h=`<div class="shiftbox ${sh}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${icon(sh)}</svg>
   <div><b>${S.name}</b><span>${S.time||"Kein Dienst geplant"}${gt?` · übernommen von ${esc(firstOf(gt))}`:""}${g?` · abgegeben an ${esc(firstOf(g))}`:""}</span></div></div>`;
  if(work){const t=colleagues(s,sh);h+=`<div class="section"><h3>Mit dir im Dienst</h3>${t.length?`<div class="team">${t.map(p=>`<span><span class="avatar">${esc(initials(p))}</span>${esc(nameOf(p))}</span>`).join("")}</div>`:`<p style="margin:0;color:var(--muted);font-size:.88rem">Aus deinem Team ist sonst niemand eingeteilt.</p>`}</div>`}
  const others=offers.filter(o=>o.by!==me&&o.status==="open"&&!approved(o));
  if(others.length&&!past)h+=`<div class="section"><h3>An diesem Tag sucht Ersatz</h3>${others.map(o=>`<div class="split" style="align-items:center"><span class="avatar">${esc(initials(o.by))}</span><span style="margin-right:auto">${esc(nameOf(o.by))} · ${SHIFTS[o.shift].name}</span>${canWrite&&sh==="X"&&!restConflict(me,s,o.shift)?`<button class="btn primary" data-take="${o.id}">Übernehmen</button>`:""}</div>`).join("")}</div>`;
  const req=offers.find(o=>o.takenBy===me&&!approved(o));
  if(req)h+=`<div class="note info">${req.status==="agreed"?`${esc(firstOf(req.by))} hat zugestimmt. Jetzt fehlt nur noch die Freigabe der Teamleitung.`:`Anfrage an ${esc(firstOf(req.by))} gesendet. Sobald zugestimmt wird, geht der Tausch an die Teamleitung.`}</div>`;

  if(past)h+=`<div class="note info">Dieser Tag liegt in der Vergangenheit.</div>`;
  else if(!canWrite)h+=`<div class="note warn">Du hast nur Leserechte und kannst hier nichts eintragen.</div>`;
  else{
    if(work&&!gt){
      if(mine){
        h+=`<div class="section"><h3>Zum Tausch angeboten</h3>${mine.note?`<p class="note info">„${esc(mine.note)}“</p>`:""}
        ${mine.status==="requested"?`<div class="split" style="align-items:center"><span class="avatar">${esc(initials(mine.takenBy))}</span><span style="margin-right:auto">${esc(nameOf(mine.takenBy))} würde übernehmen</span><button class="btn primary" data-agree="${mine.id}">Annehmen</button><button class="btn" data-decline="${mine.id}">Ablehnen</button></div>`
          :mine.status==="agreed"?`<p class="note info">Du hast ${esc(firstOf(mine.takenBy))} zugesagt. Der Tausch wartet auf die Freigabe der Teamleitung.</p>`
          :`<p style="margin:0;color:var(--muted);font-size:.88rem">Noch keine Antwort aus dem Team.</p>`}
        <div class="split"><button class="btn danger" data-withdraw="${mine.id}">Angebot zurückziehen</button></div></div>`;
      }else{
        h+=`<form class="section" id="swapForm"><h3>Dienst zum Tausch anbieten</h3>
        <div class="choices" role="radiogroup" aria-label="Was möchtest du stattdessen?">
          ${["egal","Frühdienst","Spätdienst","freier Tag"].map((x,i)=>`<label><input type="radio" name="want" id="want${i}" value="${x}" ${i===0?"checked":""}><span>${x==="egal"?"Tausch egal":x}</span></label>`).join("")}
        </div>
        <textarea id="swapNote" maxlength="280" placeholder="Kurz für dein Team: warum, und was dir im Gegenzug passt"></textarea>
        <div class="split"><button class="btn primary" type="submit">⇄ Im Team posten</button></div></form>`;
      }
    }
    const cnt=wishesIn(myWishes(),d.getFullYear(),d.getMonth()).filter(x=>x!==s).length;
    h+=`<form class="section" id="wishForm"><h3>${w?"Dein Wunsch":"Wunsch eintragen"}</h3>
      <div class="choices" role="radiogroup" aria-label="Art des Wunsches">
        ${["Frei","Frühdienst","Spätdienst","Kein Nachtdienst"].map((x,i)=>`<label><input type="radio" name="wtype" id="wt${i}" value="${x}" ${(w?w.type===x:i===0)?"checked":""}><span>${x}</span></label>`).join("")}
      </div>
      <div class="choices" role="radiogroup" aria-label="Wie wichtig?">
        <label><input type="radio" name="prio" id="pr0" value="normal" ${!w||w.prio!=="hoch"?"checked":""}><span>Wäre schön</span></label>
        <label><input type="radio" name="prio" id="pr1" value="hoch" ${w&&w.prio==="hoch"?"checked":""}><span>Wichtig</span></label>
      </div>
      <textarea id="wishNote" maxlength="280" placeholder="Notiz für die Teamleitung (optional, nur sie sieht sie)">${w?esc(w.note||""):""}</textarea>
      ${!w&&cnt>=WISH_LIMIT?`<div class="note warn">Du hast für ${MONTHS[d.getMonth()]} schon ${WISH_LIMIT} Wünsche eingetragen. Entferne einen, um Platz zu schaffen.</div>`:""}
      <div class="split"><button class="btn primary" type="submit" ${!w&&cnt>=WISH_LIMIT?"disabled":""}>★ ${w?"Wunsch speichern":"Wunsch eintragen"}</button>${w?`<button class="btn danger" type="button" data-delwish="${s}">Wunsch entfernen</button>`:""}</div>
      </form>`;
  }
  const typing=document.activeElement&&$("dBody").contains(document.activeElement)&&document.activeElement.tagName==="TEXTAREA";
  if(keepFocus&&typing)return; // nicht mitten im Tippen neu zeichnen
  $("dBody").innerHTML=h;
  $("drawer").classList.add("open");$("scrim").classList.add("open");
  if(!keepFocus)setTimeout(()=>$("dClose").focus(),50);
}
function closeDrawer(){$("drawer").classList.remove("open");$("scrim").classList.remove("open");openDay=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function refreshDrawer(){if(openDay)openDrawer(openDay,true)}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("toasts").appendChild(t);setTimeout(()=>t.remove(),4200)}

/* ---------- Aktionen ---------- */
const offerById=id=>{const o=data.offers[id];return o?Object.assign({},o):null};
function saveOffer(id,o){return put("offers",id,o)}

async function take(id){
  const o=offerById(id);if(!o||o.status!=="open")return toast("Dieses Angebot ist nicht mehr offen.");
  if(myShift(o.date)!=="X")return toast("Du hast an dem Tag selbst Dienst.");
  o.status="requested";o.takenBy=me;
  if(await saveOffer(id,o)){toast(`Anfrage an ${firstOf(o.by)} gesendet.`);
    if(mode==="demo")setTimeout(()=>{const x=offerById(id);if(!x||x.status!=="requested"||x.takenBy!==me)return;x.status="agreed";saveOffer(id,x);toast(`${firstOf(o.by)} hat zugestimmt. Jetzt fehlt nur die Freigabe der Teamleitung.`)},2600)}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b||!b.dataset)return;
  const ds=b.dataset;
  if(ds.d)return openDrawer(ds.d);
  if(ds.open){const d=fromIso(ds.open);view=new Date(d.getFullYear(),d.getMonth(),1);render();return openDrawer(ds.open)}
  if(ds.take)return take(ds.take);
  if(ds.agree){const o=offerById(ds.agree);if(!o||o.status!=="requested")return;o.status="agreed";if(await saveOffer(ds.agree,o))toast(`Du hast ${firstOf(o.takenBy)} zugesagt. Der Tausch geht jetzt an die Teamleitung.`);return}
  if(ds.decline){const o=offerById(ds.decline);if(!o)return;const who=o.takenBy;o.status="open";o.takenBy=null;if(await saveOffer(ds.decline,o))toast(`Abgelehnt. Dein Angebot ist wieder für alle offen.`);return}
  if(ds.cancel){const o=offerById(ds.cancel);if(!o||o.takenBy!==me)return;o.status="open";o.takenBy=null;if(await saveOffer(ds.cancel,o))toast("Anfrage zurückgenommen.");return}
  if(ds.withdraw){if(await del("offers",ds.withdraw))toast("Angebot zurückgezogen.");return}
  if(ds.approve){const o=offerById(ds.approve);if(!o)return;
    if(await put("approvals",ds.approve,{by:me,at:new Date().toISOString(),date:o.date})){o.status="approved";await saveOffer(ds.approve,o);toast(`Freigegeben: ${firstOf(o.takenBy)} übernimmt am ${fmt(o.date)}`)}return}
  if(ds.reject){const o=offerById(ds.reject);if(!o)return;o.status="open";o.takenBy=null;if(await saveOffer(ds.reject,o))toast("Tausch abgelehnt. Das Angebot ist wieder offen.");return}
  if(ds.delwish){const items=Object.assign({},myWishes());delete items[ds.delwish];if(await put("wishes",me,{items}))toast("Wunsch entfernt.");return}
});
document.addEventListener("change",async e=>{
  const sel=e.target.closest("select[data-group]");if(!sel)return;
  const u=sel.dataset.group,m=Object.assign({vacation:[]},data.members[u]||{});m.group=+sel.value;
  if(await put("members",u,m))toast(`${nameOf(u)} ist jetzt in ${GROUPS[m.group]}.`);
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const s=openDay;if(!s)return;
  if(e.target.id==="wishForm"){
    const f=e.target,items=Object.assign({},myWishes());
    items[s]={type:f.wtype.value,prio:f.prio.value,note:$("wishNote").value.trim().slice(0,280)};
    document.activeElement&&document.activeElement.blur();
    if(await put("wishes",me,{items}))toast(`Wunsch für ${fmt(s)} eingetragen`);
  }
  if(e.target.id==="swapForm"){
    const sh=myShift(s);if(!"FSN".includes(sh))return;
    const id=newId(),note=$("swapNote").value.trim().slice(0,280);
    document.activeElement&&document.activeElement.blur();
    if(await saveOffer(id,{by:me,date:s,shift:sh,want:e.target.want.value,note,status:"open",takenBy:null,created:Date.now()})){
      tab="mine";render();toast("Im Team gepostet. Du siehst hier, sobald sich jemand meldet.");
      if(mode==="demo")setTimeout(()=>{const o=offerById(id);if(!o||o.status!=="open")return;
        const cand=Object.keys(data.members).filter(u=>u!==me&&shiftFor(u,s)==="X"&&!restConflict(u,s,sh));if(!cand.length)return;
        o.status="requested";o.takenBy=cand[hash(s)%cand.length];saveOffer(id,o);toast(`${firstOf(o.takenBy)} würde deinen Dienst am ${fmt(s)} übernehmen.`)},4500);
    }
  }
});
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$("todayBtn").onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);render()};
$("tabTeam").onclick=()=>{tab="team";renderSwaps()};
$("tabMine").onclick=()=>{tab="mine";renderSwaps()};
$("dClose").onclick=closeDrawer;$("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openDay)closeDrawer()});
$("reset").onclick=()=>{try{localStorage.removeItem(DEMO_KEY)}catch(e){}demoSeed();demoSave();view=new Date(today.getFullYear(),today.getMonth(),1);changed();toast("Demo-Daten wiederhergestellt.")};

/* ---------- Start ---------- */
let loaded=false;
function startDemo(){mode="demo";me="me";isLead=true;canWrite=true;DEMO_TEAM.forEach((n,i)=>names["d"+i]=n);demoLoad();loaded=true;renderBanner();changed()}

async function startLive(){
  mode="live";
  const uid=await userApi.id();
  if(!uid){me="anon";canWrite=false}else me=uid;
  isLead=await userApi.canEdit();
  const cw=await userApi.can("data.write");if(cw===false)canWrite=false;
  renderBanner();
  const firstDone={};const cols=["members","wishes","offers","approvals"];
  const timer=setTimeout(()=>{if(!loaded){loaded=true;$("banner").innerHTML=`<div class="banner warn"><span><b>Die Teamdaten sind gerade nicht erreichbar.</b> Du siehst deinen Grundplan; Tausche und Wünsche erscheinen, sobald die Verbindung steht.</span></div>`;changed()}},10000);
  let joined=false;
  cols.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});data[col]=m;
      if(!snap.metadata.fromCache)firstDone[col]=true;
      if(!loaded&&cols.every(c=>firstDone[c])){loaded=true;clearTimeout(timer);renderBanner()}
      if(col==="members"&&firstDone.members&&!joined&&canWrite&&uid&&!data.members[uid]){
        joined=true;db.collection("members").doc(uid).set({group:hash(uid)%4,vacation:[],joined:TODAY}).catch(writeFailed);
      }
      if(col==="members"&&loaded)renderBanner();
      changed();
    },err=>{clearTimeout(timer);loaded=true;$("banner").innerHTML=`<div class="banner warn"><span><b>Die Verbindung zu den Teamdaten wurde beendet.</b> Lade die Seite neu, um weiterzuplanen.</span></div>`});
  });
  if(!data.members[me])data.members[me]={group:uid?hash(uid)%4:0,vacation:[]};
  changed();
}

(async function boot(){
  let d=null,u=null;
  try{if(window.claude&&typeof window.claude.use==="function"){[d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")])}}catch(e){}
  if(d&&u){db=d;userApi=u;startLive()}else startDemo();
})();
})();
</script>

</body>
